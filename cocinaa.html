<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<title>Carta digital</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111827; --bg:#f4f6f9; --card:#ffffff; --mut:#5b6472; --line:#e3e8ef;
  --ac:#0f766e; --ac-ink:#ffffff; --gold:#b45309; --danger:#b42318;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.07);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e8edf4; --bg:#0d1117; --card:#161c24; --mut:#9ba7b8; --line:#242d39;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:17px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,ul,li{margin:0}
ul{list-style:none;padding:0}
button{font:inherit; cursor:pointer; color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid #f59e0b; outline-offset:2px;
}
img{display:block}

/* ---------- Encabezado ---------- */
.hero{background:var(--ac);color:var(--ac-ink);padding:22px 18px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border-radius:50%;background:currentColor;opacity:.10;pointer-events:none}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em;position:relative}
.hero .lema{margin-top:5px;font-size:15px;opacity:.9;position:relative}
.mesa-badge{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1.5px solid currentColor;padding:7px 14px;border-radius:99px;font-weight:800;font-size:15px;position:relative}

/* ---------- Aviso sin conexión ---------- */
.offline{display:none;background:#b45309;color:#fff;text-align:center;font-weight:800;font-size:15px;padding:10px 14px}
.offline.on{display:block}

/* ---------- Chips de categorías ---------- */
.cats{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip-cat{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-weight:700;font-size:15px;white-space:nowrap;color:var(--mut);transition:background .15s,color .15s,border-color .15s}
.chip-cat.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}

/* ---------- Lista ---------- */
main{max-width:680px;margin:0 auto;padding:4px 14px 0}
h2.cat{font-size:19px;font-weight:800;margin:26px 0 10px;letter-spacing:-.01em;scroll-margin-top:70px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .14s ease}
.it:active{transform:scale(.992)}
.it.off{opacity:.5}
.it .open{display:flex;gap:12px;align-items:center;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.thumb{width:74px;height:74px;flex:none;border-radius:12px;object-fit:cover;background:var(--line)}
.thumb.ph{display:grid;place-items:center;font-size:26px;color:var(--mut)}
.info{flex:1;min-width:0;display:block}
.info b{display:block;font-size:17px;line-height:1.25}
.info small{display:block;color:var(--mut);font-size:14px;line-height:1.35;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:block;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.add{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--ac);color:var(--ac-ink);
  font-size:25px;font-weight:800;line-height:1;display:grid;place-items:center}
.off-txt{font-size:12px;font-weight:800;color:var(--danger);text-align:center;flex:none;width:52px;line-height:1.15}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:#7a4a00;background:#fde9c3;padding:2px 8px;border-radius:99px;margin-bottom:4px}
@media (prefers-color-scheme: dark){.tag{color:#ffd9a0;background:#3a2a10}}

/* ---------- Cuenta ---------- */
h2.sec{font-size:19px;font-weight:800;margin:28px 0 10px}
.ped{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.ped-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ped ul li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:2px 0;color:var(--mut)}
.ped ul li b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.ped .nota{background:#fff3cd;border-left:3px solid #f59e0b;color:#5c4300;padding:7px 10px;border-radius:8px;font-size:14px;margin-top:8px}
@media (prefers-color-scheme: dark){.ped .nota{background:#3a2c0c;color:#ffd9a0}}
.ped-hora{font-size:13px;color:var(--mut);margin-top:8px}
.st{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.st.nuevo{background:#fde7c3;color:#7a4a00}
.st.preparando{background:#cfe9f7;color:#0b4a6f}
.st.listo{background:#cdeedd;color:#0c5232}
.st.entregado{background:#e6e9ee;color:#3a4353}
@media (prefers-color-scheme: dark){
  .st.nuevo{background:#3d2b0c;color:#ffd9a0}
  .st.preparando{background:#0c2c42;color:#a8d8f5}
  .st.listo{background:#0c3322;color:#a7e8c4}
  .st.entregado{background:#242c38;color:#b8c2d1}
}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin:14px 0;font-variant-numeric:tabular-nums}
.vacio{color:var(--mut);padding:6px 0}

/* ---------- Botones ---------- */
.btn{min-height:52px;border:0;border-radius:12px;background:var(--ac);color:var(--ac-ink);
  font-weight:800;font-size:17px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  transition:filter .15s,transform .1s}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:46px;font-size:15px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}

/* ---------- Barra inferior ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
  box-shadow:0 -6px 24px rgba(16,24,40,.10);transform:translateY(130%);transition:transform .25s cubic-bezier(.2,.9,.3,1.1)}
.bar.on{transform:none}
.bar-txt{flex:1;min-width:0}
.bar-txt b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.bar-txt small{color:var(--mut);font-size:14px}
.bar .btn{width:auto;padding:0 22px}

/* ---------- Hojas (dialog) ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--ink)}
dialog::backdrop{background:rgba(9,12,18,.55)}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:680px;
  background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 44px rgba(0,0,0,.32);
  animation:subir .24s cubic-bezier(.2,.9,.3,1.05)}
@keyframes subir{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-in{padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head h2{font-size:20px;font-weight:800}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;display:grid;place-items:center}
.big{width:100%;max-height:40vh;object-fit:cover;border-radius:16px;margin-bottom:14px;background:var(--line)}
.detalle h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.detalle .desc{color:var(--mut);margin-bottom:12px}
.detalle .precio{font-size:24px;font-weight:800;margin-bottom:16px}
.cant-fila{display:flex;gap:14px;align-items:center}
.cant-fila .btn{flex:1}
.q{display:inline-flex;align-items:center;gap:4px}
.q button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ac);background:transparent;
  color:var(--ac);font-size:22px;font-weight:800;display:grid;place-items:center;line-height:1}
.q span{min-width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.linea{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.linea:last-of-type{border-bottom:0}
.l-info{flex:1;min-width:0}
.l-info b{display:block;font-size:16px}
.l-info small{color:var(--mut);font-size:14px}
.l-sub{font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.nota-lbl{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:16px 0 6px}
input.nota{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px;
  font:inherit;background:var(--card);color:var(--ink)}

/* ---------- Aviso flotante ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:100;
  transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);
  padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 12px 34px rgba(0,0,0,.32);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="offline" id="offline" role="status">Sin conexión · tus cambios quedan guardados</div>

<header class="hero">
  <h1 id="nombreLocal">Carta digital</h1>
  <p class="lema" id="lema" hidden></p>
  <div class="mesa-badge" id="mesaBadge">Mesa —</div>
</header>

<nav class="cats" id="cats" aria-label="Categorías de la carta"></nav>

<main>
  <div id="menu"><p class="vacio">Cargando la carta…</p></div>

  <h2 class="sec" id="tituloCuenta">Tu cuenta</h2>
  <div id="cuenta"><p class="vacio">Todavía no pediste nada.</p></div>

  <div id="repetirWrap" hidden style="margin-bottom:12px">
    <button class="btn ghost sm" id="btnRepetir">🔁 Repetir mi último pedido</button>
  </div>

  <div class="acc">
    <button class="btn ghost sm" id="btnMozo">🙋 Llamar al mozo</button>
    <button class="btn ghost sm" id="btnCuenta">🧾 Pedir la cuenta</button>
  </div>
</main>

<!-- Barra inferior del carrito -->
<div class="bar" id="bar">
  <div class="bar-txt">
    <b id="barTotal">$0</b>
    <small id="barCant">0 ítems</small>
  </div>
  <button class="btn" id="btnVerPedido">Ver pedido</button>
</div>

<!-- Hoja: detalle del plato -->
<dialog id="dlgPlato" class="sheet" aria-label="Detalle del plato">
  <div class="sheet-in">
    <div class="sheet-head"><span></span><button class="x" data-cerrar aria-label="Cerrar">✕</button></div>
    <div id="platoCont"></div>
  </div>
</dialog>

<!-- Hoja: carrito -->
<dialog id="dlgCarrito" class="sheet" aria-label="Tu pedido">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2>Tu pedido</h2>
      <button class="x" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <div id="carItems"></div>
    <label class="nota-lbl" for="nota">Aclaraciones (opcional)</label>
    <input id="nota" class="nota" maxlength="120" placeholder="Sin sal, bien cocida, sin hielo…">
    <div class="tot"><span>Total</span><span id="carTotal">$0</span></div>
    <button class="btn" id="btnAConfirmar">Confirmar pedido</button>
  </div>
</dialog>

<!-- Hoja: confirmación final -->
<dialog id="dlgConf" class="sheet" aria-label="Confirmar pedido">
  <div class="sheet-in" id="confCont"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   Configuración de Firebase (NO CAMBIAR)
   ============================================================ */
firebase.initializeApp({
  databaseURL:"https://fir-pedidos-6efa9-default-rtdb.firebaseio.com",
  projectId:"fir-pedidos-6efa9"
});
const db = firebase.database();
const $  = (s, r=document) => r.querySelector(s);
const $$all = (s, r=document) => [...r.querySelectorAll(s)];

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const plata = n => "$" + Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0});

const hora = t => t ? new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}) : "";

/* Mesa tomada de la URL (?mesa=5) */
const MESA = (new URLSearchParams(location.search).get("mesa") || "1").trim().slice(0,20) || "1";

/* Claves de persistencia local, separadas por mesa */
const K_CART = "carta_cart_" + MESA;
const K_LAST = "carta_last_" + MESA;

/* ---------- Estado ---------- */
let menu = {}, cfg = {}, pedidos = {}, cart = {};
let conectado = navigator.onLine;
let prevEstados = {};          // para detectar cuando un pedido pasa a "listo"
let platoActual = null, platoQty = 1;

/* ---------- Color del local con contraste seguro ---------- */
function hex2rgb(h){ h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hex(r,g,b){ return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function lum(h){
  const [r,g,b] = hex2rgb(h).map(v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function mezclar(a,b,t){ const A=hex2rgb(a), B=hex2rgb(b); return rgb2hex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }

function aplicarColor(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex||"")) return;
  const oscuro = matchMedia("(prefers-color-scheme: dark)").matches;
  let c = hex;
  if(oscuro && lum(c) < 0.22) c = mezclar(c, "#ffffff", 0.45);
  if(!oscuro && lum(c) > 0.78) c = mezclar(c, "#000000", 0.35);
  const r = document.documentElement.style;
  r.setProperty("--ac", c);
  r.setProperty("--ac-ink", lum(c) > 0.55 ? "#111827" : "#ffffff");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if(cfg.color) aplicarColor(cfg.color);
});

/* ---------- Persistencia del carrito ---------- */
function guardarCarrito(){
  try{ localStorage.setItem(K_CART, JSON.stringify(cart)); }catch(e){ /* cuota llena */ }
}
function cargarCarrito(){
  try{ cart = JSON.parse(localStorage.getItem(K_CART) || "{}") || {}; }catch(e){ cart = {}; }
}

/* ---------- Orden del menú (misma lógica que la cocina) ---------- */
function valOrden(m){
  const v = m && m.orden;
  return (v == null || isNaN(Number(v))) ? Infinity : Number(v);
}
function ordenMenu(){
  const catOrd = cfg.catOrden || {};
  const cats = {};
  Object.keys(menu).forEach(id => {
    const c = (menu[id] && menu[id].categoria) || "Otros";
    (cats[c] = cats[c] || []).push(id);
  });
  const catNames = Object.keys(cats).sort((a,b) => {
    const oa = catOrd[a], ob = catOrd[b];
    const fa = typeof oa === "number", fb = typeof ob === "number";
    if(fa && fb) return oa - ob;
    if(fa) return -1;
    if(fb) return 1;
    return a.localeCompare(b, "es");
  });
  catNames.forEach(c => cats[c].sort((x,y) => {
    const d = valOrden(menu[x]) - valOrden(menu[y]);
    if(d) return d;
    return String(x).localeCompare(String(y));
  }));
  return { cats, catNames };
}

/* ---------- Pintar carta ---------- */
function cardItem(id){
  const m = menu[id]; if(!m) return "";
  const off = m.disponible === false;
  const foto = m.foto
    ? `<img class="thumb" src="${esc(m.foto)}" alt="" loading="lazy" decoding="async">`
    : `<span class="thumb ph" aria-hidden="true">🍽️</span>`;
  return `<div class="it ${off?"off":""}">
    <button class="open" data-open="${esc(id)}" aria-label="Ver ${esc(m.nombre)}">
      ${foto}
      <span class="info">
        ${m.destacado ? `<span class="tag">Recomendado</span>` : ""}
        <b>${esc(m.nombre)}</b>
        <small>${esc(m.desc||"")}${off?" · Sin stock":""}</small>
        <span class="price">${plata(m.precio)}</span>
      </span>
    </button>
    ${off
      ? `<span class="off-txt">Sin stock</span>`
      : `<button class="add" data-add="${esc(id)}" aria-label="Agregar ${esc(m.nombre)} al pedido">+</button>`}
  </div>`;
}

let observador = null;
function drawMenu(){
  const { cats, catNames } = ordenMenu();
  const cont = $("#menu");

  if(!catNames.length){
    cont.innerHTML = `<p class="vacio">La carta todavía no está cargada.</p>`;
    $("#cats").innerHTML = "";
    drawBar();
    return;
  }

  const destacados = Object.keys(menu).filter(id => menu[id].destacado && menu[id].disponible !== false);
  let html = "";
  const chips = [];

  if(destacados.length){
    html += `<h2 class="cat" id="sec-dest">Recomendados ⭐</h2>` + destacados.map(cardItem).join("");
    chips.push({ id:"sec-dest", label:"Recomendados" });
  }
  catNames.forEach((c, i) => {
    html += `<h2 class="cat" id="sec-${i}">${esc(c)}</h2>` + cats[c].map(cardItem).join("");
    chips.push({ id:`sec-${i}`, label:c });
  });
  cont.innerHTML = html;

  // Chips sticky
  $("#cats").innerHTML = chips.map((ch,i) =>
    `<button class="chip-cat ${i===0?"on":""}" data-goto="${esc(ch.id)}">${esc(ch.label)}</button>`
  ).join("");

  observarSecciones();
  drawBar();
}

function observarSecciones(){
  if(observador) observador.disconnect();
  const heads = $$all("main h2.cat");
  if(!heads.length) return;
  observador = new IntersectionObserver(entradas => {
    entradas.forEach(en => {
      if(!en.isIntersecting) return;
      $$all(".chip-cat").forEach(b => b.classList.toggle("on", b.dataset.goto === en.target.id));
    });
  }, { rootMargin:"-76px 0px -68% 0px", threshold:0 });
  heads.forEach(h => observador.observe(h));
}

/* ---------- Barra del carrito ---------- */
function totalCarrito(){
  return Object.keys(cart).reduce((a,id) => {
    const m = menu[id]; return a + (m ? (Number(m.precio)||0) * cart[id] : 0);
  }, 0);
}
function drawBar(){
  const n = Object.values(cart).reduce((a,c) => a + c, 0);
  const t = totalCarrito();
  $("#bar").classList.toggle("on", n > 0);
  $("#barTotal").textContent = plata(t);
  $("#barCant").textContent = n === 1 ? "1 ítem" : n + " ítems";
}

/* ---------- Interacción con la carta ---------- */
$("#menu").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  const add  = e.target.closest("[data-add]");
  if(open){ abrirPlato(open.dataset.open); return; }
  if(add){
    const id = add.dataset.add;
    cart[id] = (cart[id] || 0) + 1;
    guardarCarrito(); drawMenu(); renderCarrito();
    aviso("Agregado al pedido");
  }
});

$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-goto]"); if(!b) return;
  const el = document.getElementById(b.dataset.goto);
  if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  b.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
});

/* ---------- Detalle del plato ---------- */
function abrirPlato(id){
  const m = menu[id]; if(!m) return;
  platoActual = id; platoQty = 1;
  const off = m.disponible === false;
  $("#platoCont").innerHTML = `
    ${m.foto ? `<img class="big" src="${esc(m.foto)}" alt="${esc(m.nombre)}">` : ""}
    <div class="detalle">
      ${m.destacado ? `<span class="tag">Recomendado</span>` : ""}
      <h2>${esc(m.nombre)}</h2>
      <p class="desc">${esc(m.desc || "Sin descripción.")}</p>
      <div class="precio">${plata(m.precio)}</div>
      ${off ? `<p class="vacio">Por ahora no está disponible.</p>` : `
      <div class="cant-fila">
        <div class="q">
          <button data-paso="-1" aria-label="Restar uno">−</button>
          <span id="platoQty" aria-live="polite">1</span>
          <button data-paso="1" aria-label="Sumar uno">+</button>
        </div>
        <button class="btn" id="platoAdd">Agregar · <span id="platoSub">${plata(m.precio)}</span></button>
      </div>`}
    </div>`;
  $("#dlgPlato").showModal();
}

$("#platoCont").addEventListener("click", e => {
  const paso = e.target.closest("[data-paso]");
  if(paso){
    platoQty = Math.max(1, platoQty + Number(paso.dataset.paso));
    $("#platoQty").textContent = platoQty;
    const m = menu[platoActual];
    if(m) $("#platoSub").textContent = plata((Number(m.precio)||0) * platoQty);
    return;
  }
  if(e.target.closest("#platoAdd")){
    if(!platoActual) return;
    cart[platoActual] = (cart[platoActual] || 0) + platoQty;
    guardarCarrito(); drawMenu(); renderCarrito();
    $("#dlgPlato").close();
    aviso("Agregado al pedido");
  }
});

/* ---------- Carrito ---------- */
function renderCarrito(){
  const ids = Object.keys(cart).filter(id => cart[id] > 0 && menu[id]);
  if(!ids.length){
    $("#carItems").innerHTML = `<p class="vacio">Tu carrito está vacío.</p>`;
    $("#carTotal").textContent = plata(0);
    $("#btnAConfirmar").disabled = true;
    return;
  }
  $("#btnAConfirmar").disabled = false;
  $("#carItems").innerHTML = ids.map(id => {
    const m = menu[id];
    return `<div class="linea">
      <div class="l-info">
        <b>${esc(m.nombre)}</b>
        <small>${plata(m.precio)} c/u</small>
      </div>
      <div class="q">
        <button data-menos="${esc(id)}" aria-label="Quitar uno de ${esc(m.nombre)}">−</button>
        <span aria-live="polite">${cart[id]}</span>
        <button data-mas="${esc(id)}" aria-label="Agregar uno de ${esc(m.nombre)}">+</button>
      </div>
      <b class="l-sub">${plata((Number(m.precio)||0) * cart[id])}</b>
    </div>`;
  }).join("");
  $("#carTotal").textContent = plata(totalCarrito());
}

$("#carItems").addEventListener("click", e => {
  const mas = e.target.closest("[data-mas]");
  const menos = e.target.closest("[data-menos]");
  if(mas){ cart[mas.dataset.mas]++; }
  if(menos){
    const id = menos.dataset.menos;
    cart[id]--;
    if(cart[id] <= 0) delete cart[id];
  }
  guardarCarrito(); renderCarrito(); drawBar(); drawMenu();
});

$("#btnVerPedido").onclick = () => { renderCarrito(); $("#dlgCarrito").showModal(); };

/* Cerrar hojas */
document.addEventListener("click", e => {
  const x = e.target.closest("[data-cerrar]");
  if(x){ const d = x.closest("dialog"); if(d) d.close(); }
});

/* ---------- Confirmación en dos pasos ---------- */
$("#btnAConfirmar").onclick = () => {
  const ids = Object.keys(cart).filter(id => cart[id] > 0 && menu[id]);
  if(!ids.length) return;
  const t = totalCarrito();
  const n = ids.reduce((a,id) => a + cart[id], 0);
  $("#confCont").innerHTML = `
    <div class="sheet-head"><h2>¿Enviamos el pedido?</h2><button class="x" data-cerrar aria-label="Cerrar">✕</button></div>
    <p style="color:var(--mut);margin-bottom:16px">
      Vas a enviar <b>${n}</b> ${n===1?"ítem":"ítems"} a la cocina por <b>${plata(t)}</b>.
    </p>
    ${conectado ? "" : `<p style="background:#fde7c3;color:#7a4a00;padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:16px">
      Sin conexión. Cuando vuelva la señal vas a poder enviarlo: el carrito queda guardado.</p>`}
    <div class="acc" style="grid-template-columns:1fr">
      <button class="btn" id="btnEnviar" ${conectado ? "" : "disabled"}>Sí, enviar pedido</button>
      <button class="btn ghost" data-cerrar>Volver a revisar</button>
    </div>`;
  $("#dlgCarrito").close();
  $("#dlgConf").showModal();
};

$("#confCont").addEventListener("click", async e => {
  if(!e.target.closest("#btnEnviar")) return;
  const btn = $("#btnEnviar");
  btn.disabled = true; btn.textContent = "Enviando…";

  const ids = Object.keys(cart).filter(id => cart[id] > 0 && menu[id]);
  const items = ids.map(id => ({
    id,
    nombre: menu[id].nombre,
    precio: Number(menu[id].precio) || 0,
    cant: cart[id]
  }));
  if(!items.length){ $("#dlgConf").close(); return; }
  const total = items.reduce((a,i) => a + i.precio * i.cant, 0);
  const nota = ($("#nota").value || "").trim().slice(0,120);

  try{
    await db.ref("pedidos").push({
      mesa: MESA, items, total, nota,
      estado: "nuevo", cerrado: false,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    try{ localStorage.setItem(K_LAST, JSON.stringify(items)); }catch(err){}
    cart = {}; guardarCarrito(); $("#nota").value = "";
    $("#dlgConf").close();
    drawMenu(); renderCarrito();
    actualizarBotonRepetir();
    aviso("¡Pedido enviado a la cocina! ✅");
  }catch(err){
    btn.disabled = false; btn.textContent = "Sí, enviar pedido";
    aviso("No pudimos enviar el pedido. Revisá tu conexión.");
  }
});

/* ---------- Repetir último pedido ---------- */
function actualizarBotonRepetir(){
  let hay = false;
  try{ hay = (JSON.parse(localStorage.getItem(K_LAST)||"[]")||[]).length > 0; }catch(e){}
  $("#repetirWrap").hidden = !hay;
}
$("#btnRepetir").onclick = () => {
  let ultimo = [];
  try{ ultimo = JSON.parse(localStorage.getItem(K_LAST)||"[]") || []; }catch(e){}
  let agregados = 0;
  ultimo.forEach(x => {
    const m = menu[x.id];
    if(m && m.disponible !== false){
      cart[x.id] = (cart[x.id] || 0) + (Number(x.cant) || 1);
      agregados += Number(x.cant) || 1;
    }
  });
  if(!agregados){ aviso("Los platos de tu último pedido ya no están disponibles."); return; }
  guardarCarrito(); drawMenu(); renderCarrito();
  $("#dlgCarrito").showModal();
  aviso("Sumamos tu último pedido al carrito");
};

/* ---------- Cuenta ---------- */
const TEXTO_ESTADO = { nuevo:"Recibido", preparando:"En preparación", listo:"¡Listo!", entregado:"Entregado" };
const ICONO_ESTADO = { nuevo:"🧾", preparando:"👨‍🍳", listo:"✅", entregado:"🍽️" };

function drawCuenta(){
  const mias = Object.entries(pedidos)
    .filter(([,p]) => String(p.mesa) === MESA && !p.cerrado)
    .sort((a,b) => (a[1].ts||0) - (b[1].ts||0));

  if(!mias.length){
    $("#cuenta").innerHTML = `<p class="vacio">Todavía no pediste nada.</p>`;
    return;
  }
  let total = 0;
  $("#cuenta").innerHTML = mias.map(([id,p], i) => {
    total += Number(p.total) || 0;
    const est = p.estado || "nuevo";
    return `<article class="ped">
      <div class="ped-top">
        <b>Pedido ${i+1}</b>
        <span class="st ${esc(est)}">${ICONO_ESTADO[est]||""} ${esc(TEXTO_ESTADO[est]||est)}</span>
      </div>
      <ul>${(p.items||[]).map(x =>
        `<li><span>${Number(x.cant)||0} × ${esc(x.nombre)}</span>
         <b>${plata((Number(x.cant)||0) * (Number(x.precio)||0))}</b></li>`).join("")}</ul>
      ${p.nota ? `<p class="nota"><b>Nota:</b> ${esc(p.nota)}</p>` : ""}
      <div class="ped-hora">Enviado a las ${hora(p.ts)}</div>
    </article>`;
  }).join("") + `<div class="tot"><span>Total</span><span>${plata(total)}</span></div>`;
}

/* Aviso cuando un pedido pasa a "listo" */
function detectarListo(){
  let hayListo = false;
  Object.entries(pedidos).forEach(([id,p]) => {
    if(String(p.mesa) !== MESA) return;
    const antes = prevEstados[id];
    if(p.estado === "listo" && antes && antes !== "listo" && !p.cerrado) hayListo = true;
    prevEstados[id] = p.estado;
  });
  if(hayListo){
    aviso("🍽️ ¡Tu pedido está listo!");
    if(navigator.vibrate) navigator.vibrate([120,80,120]);
  }
}

/* ---------- Llamar al mozo / pedir cuenta ---------- */
let bloqueo = false;
function llamar(tipo, texto){
  if(bloqueo) return;
  if(!conectado){ aviso("Sin conexión. Probá de nuevo en un momento."); return; }
  bloqueo = true;
  setTimeout(() => bloqueo = false, 20000);
  db.ref("llamados").push({
    mesa: MESA, tipo, atendido: false,
    ts: firebase.database.ServerValue.TIMESTAMP
  }).then(() => aviso(texto))
    .catch(() => aviso("No pudimos avisar. Revisá tu conexión."));
}
$("#btnMozo").onclick  = () => llamar("mozo", "Avisamos al mozo 🙋");
$("#btnCuenta").onclick = () => llamar("cuenta", "Pedimos tu cuenta 🧾");

/* ---------- Aviso flotante ---------- */
let timerToast = null;
function aviso(t){
  const el = $("#toast");
  el.textContent = t;
  el.classList.add("on");
  clearTimeout(timerToast);
  timerToast = setTimeout(() => el.classList.remove("on"), 2800);
}

/* ---------- Conexión ---------- */
function pintarConexion(){
  $("#offline").classList.toggle("on", !conectado);
}
window.addEventListener("online",  () => { conectado = true;  pintarConexion(); });
window.addEventListener("offline", () => { conectado = false; pintarConexion(); });
db.ref(".info/connected").on("value", s => {
  const enLinea = s.val() === true;
  // Sólo marcamos "sin conexión" si además el navegador dice estar offline
  conectado = enLinea || navigator.onLine;
  pintarConexion();
});

/* ---------- Limpieza del carrito cuando cambia la carta ---------- */
function podarCarrito(){
  let quitados = 0;
  Object.keys(cart).forEach(id => {
    const m = menu[id];
    if(!m || m.disponible === false){ delete cart[id]; quitados++; }
  });
  if(quitados){
    guardarCarrito();
    aviso(quitados === 1 ? "Quitamos un plato que se quedó sin stock" : "Quitamos platos que se quedaron sin stock");
  }
}

/* ---------- Suscripciones a la base ---------- */
db.ref("config").on("value", s => {
  cfg = s.val() || {};
  $("#nombreLocal").textContent = cfg.nombre || "Carta digital";
  document.title = (cfg.nombre || "Carta digital") + " · Mesa " + MESA;
  const lema = $("#lema");
  lema.textContent = cfg.lema || "";
  lema.hidden = !cfg.lema;
  if(cfg.color) aplicarColor(cfg.color);
  drawMenu();
});

db.ref("menu").on("value", s => {
  menu = s.val() || {};
  podarCarrito();
  drawMenu();
  renderCarrito();
});

db.ref("pedidos").on("value", s => {
  pedidos = s.val() || {};
  detectarListo();
  drawCuenta();
});

/* ---------- Arranque ---------- */
$("#mesaBadge").textContent = "Mesa " + MESA;
cargarCarrito();
pintarConexion();
actualizarBotonRepetir();
renderCarrito();
</script>
</body>
</html>
